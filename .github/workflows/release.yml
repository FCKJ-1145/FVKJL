name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 发版前三处版本必须与 tag 一致，否则更新链路会拿到错误的版本号。
      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($conf.version -ne $tag) { throw "tauri.conf.json 版本 ($($conf.version)) 与 tag ($tag) 不一致" }
          if ($pkg.version -ne $tag) { throw "package.json 版本 ($($pkg.version)) 与 tag ($tag) 不一致" }
          if ($cargoVersion -ne $tag) { throw "src-tauri/Cargo.toml 版本 ($cargoVersion) 与 tag ($tag) 不一致" }

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FVKJL v__VERSION__'
          releaseBody: '下载下方安装包，已有版本会自动检查更新。'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      # 把 latest.json 里的下载地址改写成镜像，加快国内下载速度。
      # 签名在打包时已生成，改写 URL 不影响安装包的签名校验。
      - name: Rewrite updater URLs to mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR: https://gh-proxy.com/
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP 'updater'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download $tag --pattern latest.json --dir $dir --clobber
          $file = Join-Path $dir 'latest.json'
          $json = Get-Content $file -Raw | ConvertFrom-Json
          foreach ($key in $json.platforms.PSObject.Properties.Name) {
            $url = $json.platforms.$key.url
            if ($url -and -not $url.StartsWith($env:MIRROR)) {
              $json.platforms.$key.url = "$env:MIRROR$url"
            }
          }
          $text = $json | ConvertTo-Json -Depth 10
          [IO.File]::WriteAllText($file, $text, (New-Object System.Text.UTF8Encoding($false)))
          gh release upload $tag $file --clobber
          Get-Content $file -Raw
