[package]
name = "aster-launcher"
version = "0.2.1"
description = "FVKJL desktop shell"
edition = "2024"
rust-version = "1.90.0"

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen"] }

[dependencies]
async_zip = { workspace = true, features = ["deflate", "tokio-fs"] }
base64 = { workspace = true }
chrono = { workspace = true }
daedalus = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
notify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-http = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-updater = { workspace = true }
tempfile = { workspace = true }
theseus = { workspace = true, features = ["tauri"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing = { workspace = true }
tracing-error = { workspace = true }
trash = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dependencies.tauri]
workspace = true
features = [
  "devtools",
  "protocol-asset",
  "tray-icon",
  "unstable"
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(windows)".dependencies.windows]
workspace = true
features = [
  "Foundation",
  "UI_ViewManagement",
  "Win32_Graphics_Dwm",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true